name: Build APK (Roku Cast Bridge)

# Compila o app Android em toda push/PR que mexer em android-bridge/,
# e também pode ser disparado manualmente na aba "Actions" do GitHub.
on:
  push:
    branches: [main, master]
    paths:
      - "android-bridge/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "android-bridge/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: roku-cast-bridge-debug-apk
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
