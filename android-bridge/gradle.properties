# Usa as bibliotecas AndroidX (obrigatório no AGP 8.x — sem isto o build
# falha em :app:dataBindingMergeDependencyArtifactsDebug).
android.useAndroidX=true

# R class por módulo, sem transitividade — build mais rápido, padrão em
# projetos novos. Todas as dependências aqui já são AndroidX, então
# android.enableJetifier NÃO é necessário.
android.nonTransitiveRClass=true

# JVM do Gradle Daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

kotlin.code.style=official
